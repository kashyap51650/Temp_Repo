server {
  listen 5173;
  server_name _;
  server_tokens off;
 
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self'; style-src 'self' https: 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https://*.omtdb.macrocyclics.com wss://*.omtdb.macrocyclics.com https://*.blob.core.windows.net https://*.simform.solutions https://*.ingest.sentry.io; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 
  location / {
    try_files $uri /index.html;
  }
}